repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    # Keep in sync with ruff version in requirements-dev.txt
    rev: v0.17.4
    hooks:
      - id: ruff-format
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]

  # mypy runs in the project's (activated) virtualenv, so it sees the same packages and type stubs
  # (dagster, pandas-stubs, types-geopandas, ...) as CI and `make lint-check`, instead of an isolated
  # pre-commit environment with a separately maintained list of additional_dependencies.
  - repo: local
    hooks:
    - id: mypy
      name: mypy
      entry: mypy pipeline tests
      language: system
      types: [python]
      pass_filenames: false
