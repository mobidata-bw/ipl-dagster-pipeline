name: lint

on:
  pull_request:
  push:
    branches:
      - main
  # make workflow "callable" by others
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          requirements-dagster.txt
          requirements-pipeline.txt
          requirements-dev.txt

    # GDAL (requirements-pipeline-gdal.txt) is intentionally not installed: it needs system libraries
    # and osgeo is excluded from type-checking (ignore_missing_imports) anyway.
    - name: pip install
      run: pip install -r requirements-dagster.txt -r requirements-pipeline.txt -r requirements-dev.txt

    - name: lint using ruff
      run: ruff check --output-format=github .

    - name: format using ruff
      run: ruff format --check --diff .

    - name: type-check using mypy
      run: mypy pipeline tests
